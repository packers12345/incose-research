[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incose-research"
version = "1.0.0"
description = "ICAIv2 rule extraction, the n8n evaluation testbed, and reviewer-reliability scoring"
requires-python = ">=3.10"

# The components import a common core (`shared`). Before the split that worked
# only by accident — every tool was launched from backend/, which put the
# evaluator on sys.path. Declaring real packages here is what replaces that:
# `pip install -e .` makes every import resolve from any working directory.
dependencies = [
    "anthropic>=0.86.0",
    "openai>=1.30.0",
    "python-dotenv==1.0.1",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# The ICAIv2 Studio (icai_v2/app) — a local UI for running the pipeline on
# uploaded feedback. Not needed to run the pipeline from the command line.
studio = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "python-multipart==0.0.9",
]

[tool.setuptools]
packages = [
    "shared",
    "n8n_testbed",
    "n8n_testbed.plots",
    "reviewer_reliability",
    "icai_v2",
    "icai_v2.pipeline",
    "icai_v2.app",
    "icai_v2.app.backend",
]

[tool.setuptools.package-data]
shared = ["rubrics/*.json"]
